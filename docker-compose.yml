services:
  argos-dj:
    build: .
    container_name: argos-dj
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/dj.sqlite
      PUERTO: "3100"
    volumes:
      - dj-data:/data
    cpus: 0.25
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  dj-data:
